<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="warmShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4"/>
      <feOffset dx="0.5" dy="1.2" result="o"/>
      <feFlood flood-color="#8a6a3a" flood-opacity="0.32"/>
      <feComposite in2="o" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(64 64) rotate(-3)" filter="url(#warmShadow)">
    <rect x="-44" y="-44" width="88" height="88" rx="2.5" fill="#fdfbf4" stroke="#e6dfc8" stroke-width="0.7"/>
  </g>
  <circle cx="80" cy="80" r="9.5" fill="#7a1f2b"/>
</svg>
