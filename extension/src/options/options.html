<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jeom settings</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #202124;
        background: #ffffff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: #ffffff;
        font-family: inherit;
        font-size: 16px;
        line-height: 1.5;
      }

      button, input, select, code { font: inherit; }

      main {
        width: min(620px, calc(100% - 32px));
        margin: 0 auto;
        padding: 40px 0 56px;
      }

      header {
        padding-bottom: 20px;
        border-bottom: 1px solid #dadce0;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
      }

      section {
        padding: 28px 0;
        border-bottom: 1px solid #dadce0;
      }

      h2 {
        margin: 0 0 20px;
        font-size: 16px;
        font-weight: 600;
      }

      .form-grid {
        display: grid;
        gap: 16px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        font-weight: 500;
      }

      input, select {
        width: 100%;
        height: 40px;
        padding: 0 10px;
        border: 1px solid #bdc1c6;
        border-radius: 4px;
        color: #202124;
        background: #ffffff;
        font-size: 14px;
      }

      input:focus, select:focus {
        outline: 2px solid #1a73e8;
        outline-offset: -1px;
        border-color: #1a73e8;
      }

      .hint {
        margin-top: 5px;
        color: #5f6368;
        font-size: 12px;
      }

      .actions, .footer-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 20px;
      }

      button {
        min-height: 36px;
        padding: 0 14px;
        border: 1px solid #bdc1c6;
        border-radius: 4px;
        color: #202124;
        background: #ffffff;
        font-weight: 500;
        cursor: pointer;
      }

      button:hover:not(:disabled) { background: #f8f9fa; }
      button:disabled { cursor: default; opacity: 0.55; }

      button.primary {
        border-color: #1a73e8;
        color: #ffffff;
        background: #1a73e8;
      }

      button.primary:hover:not(:disabled) { background: #1765cc; }

      .connection-status, .saved {
        color: #5f6368;
        font-size: 12px;
      }

      .connection-status.ok, .saved { color: #137333; }
      .connection-status.error { color: #c5221f; }

      details { margin-top: 20px; }

      summary {
        color: #5f6368;
        font-size: 13px;
        cursor: pointer;
      }

      .check-row {
        display: grid;
        grid-template-columns: 18px 1fr;
        gap: 8px;
        margin-top: 14px;
        font-weight: 400;
      }

      .check-row input {
        width: 16px;
        height: 16px;
        margin: 2px 0 0;
      }

      .check-row strong { display: block; font-weight: 500; }
      .check-row span span { color: #5f6368; font-size: 12px; }

      .provider-summary, .endpoint-readout { display: none; }
      [hidden] { display: none !important; }

      @media (max-width: 520px) {
        main { width: min(100% - 24px, 620px); padding-top: 24px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Jeom settings</h1>
      </header>

      <section aria-labelledby="connection-heading">
        <h2 id="connection-heading">1. Enter your model</h2>

        <div class="provider-summary" aria-live="polite">
          <div id="providerGlyph">OR</div>
          <div id="providerName">OpenRouter</div>
          <div id="providerDescription"></div>
          <span id="protocolBadge">OpenAI-compatible</span>
        </div>

        <div class="form-grid">
          <div class="field">
            <label for="llmProvider">Service</label>
            <select id="llmProvider">
              <optgroup label="Router">
                <option value="openrouter">OpenRouter</option>
              </optgroup>
              <optgroup label="Direct providers">
                <option value="openai">OpenAI</option>
                <option value="anthropic">Anthropic</option>
                <option value="google">Google Gemini</option>
                <option value="groq">Groq</option>
                <option value="mistral">Mistral AI</option>
                <option value="deepseek">DeepSeek</option>
                <option value="together">Together AI</option>
                <option value="xai">xAI</option>
                <option value="cerebras">Cerebras</option>
                <option value="fireworks">Fireworks AI</option>
              </optgroup>
              <optgroup label="Local models">
                <option value="ollama">Ollama (local)</option>
                <option value="lm-studio">LM Studio (local)</option>
              </optgroup>
              <optgroup label="Cloud &amp; custom">
                <option value="azure-openai">Azure OpenAI</option>
                <option value="anthropic-foundry">Anthropic via Azure AI Foundry</option>
                <option value="custom-openai">Custom OpenAI-compatible</option>
                <option value="custom-anthropic">Custom Anthropic-compatible</option>
              </optgroup>
            </select>
            <div class="hint" id="providerHint">Choose the service that hosts your model.</div>
          </div>

          <div class="field">
            <label for="llmModel">Model</label>
            <input id="llmModel" list="modelSuggestions" type="text" autocomplete="off" />
            <datalist id="modelSuggestions"></datalist>
          </div>

          <div class="field" id="endpointWrap" hidden>
            <label for="llmEndpoint">Endpoint or base URL</label>
            <input id="llmEndpoint" type="url" autocomplete="off" />
            <div class="hint" id="endpointHint"></div>
          </div>

          <div class="field" id="authWrap" hidden>
            <label for="llmAuth">Authentication</label>
            <select id="llmAuth">
              <option value="bearer">Authorization: Bearer</option>
              <option value="x-api-key">x-api-key</option>
              <option value="api-key">api-key</option>
              <option value="none">No authentication</option>
            </select>
          </div>

          <div class="field" id="apiKeyWrap">
            <label for="llmApiKey">API key <span id="apiKeyOptional"></span></label>
            <input id="llmApiKey" type="password" autocomplete="off" spellcheck="false" />
            <div class="hint" id="apiKeyHint">Stored locally in Chrome.</div>
          </div>
        </div>

        <div class="endpoint-readout" id="endpointReadout"></div>

        <div class="actions">
          <button id="discoverModels" type="button">Find available models</button>
          <button id="testConnection" type="button">Test connection</button>
          <span class="connection-status" id="connectionStatus"></span>
        </div>
      </section>

      <section aria-labelledby="behavior-heading">
        <h2 id="behavior-heading">2. Reading mode</h2>

        <div class="field">
          <label for="renderMode">Mode</label>
          <select id="renderMode">
            <option value="in-situ">In-situ dots (default)</option>
            <option value="reader">Reader view</option>
          </select>
        </div>

        <details>
          <summary>Advanced settings</summary>
          <label class="check-row">
            <input id="shareDogfoodTelemetry" type="checkbox" />
            <span>
              <strong>Share diagnostic data</strong>
              <span>Off by default. API keys are never logged.</span>
            </span>
          </label>
          <label class="check-row">
            <input id="developerMode" type="checkbox" />
            <span>
              <strong>Developer mode</strong>
              <span>Show the reading pipeline trace.</span>
            </span>
          </label>
        </details>
      </section>

      <div class="footer-actions">
        <button class="primary" id="save" type="button">Save</button>
        <span class="saved" id="saved" aria-live="polite"></span>
      </div>
    </main>

    <script type="module" src="options.ts"></script>
  </body>
</html>
